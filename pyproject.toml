[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hdgfem"
version = "0.1.0"
description = "Self-contained DG/HDG simulator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numba",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
mesh = ["gmsh"]
plot = ["pyvista"]
test = ["pytest"]
all = ["gmsh", "pyvista", "pytest"]

[tool.setuptools]
packages = [
    "hdgfem",
    "hdgfem.assembly",
    "hdgfem.backends",
    "hdgfem.core",
    "hdgfem.io",
    "hdgfem.kernels",
    "hdgfem.linalg",
    "hdgfem.solvers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
