[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdgfem"
version = "0.1.0a1"
description = "Self-contained DG/HDG simulator."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numba",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
manufactured = ["sympy>=1.13,<1.15"]
mesh = ["gmsh"]
pardiso = ["pypardiso>=0.4.7,<0.5"]
plot = ["matplotlib", "pyvista"]
holoviz = ["holoscan-cu13>=4.6,<5", "cupy-cuda13x>=14,<15", "matplotlib", "pillow", "imageio-ffmpeg>=0.6,<0.7"]
test = ["pytest", "matplotlib", "tomli; python_version < '3.11'"]
release = ["build", "twine"]
all = ["gmsh", "matplotlib", "pyvista", "pytest", "tomli; python_version < '3.11'"]

[project.urls]
Repository = "https://github.com/adelsaleh/hdgfem"

[tool.setuptools.packages.find]
include = ["hdgfem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"hdgfem.core" = ["geometries/*.geo"]
