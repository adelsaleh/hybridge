[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dgfem"
version = "0.1.0"
description = "Self-contained DG/HDG simulator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numba",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
mesh = ["gmsh"]
plot = ["pyvista"]
test = ["pytest"]
all = ["gmsh", "pyvista", "pytest"]

[tool.setuptools]
packages = [
    "dgfem",
    "dgfem.assembly",
    "dgfem.backends",
    "dgfem.core",
    "dgfem.io",
    "dgfem.kernels",
    "dgfem.linalg",
    "dgfem.solvers",
]

[tool.setuptools.package-dir]
dgfem = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
