name: early-alpha

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python scripts/dev/alpha_test_matrix.py host-fast
      - run: python scripts/dev/alpha_test_matrix.py cpu-parity

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install '.[test,release]'
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/dev/clean_install_smoke.py --with-dependencies
