# Main numerical versions exercised by the integration tests.
# Export a platform-specific conda explicit spec for an archival binary lock.
name: equiband
channels:
  - conda-forge
dependencies:
  - python=3.13
  - fenics-dolfinx=0.11.0
  - fenics-basix=0.11.0
  - fenics-ufl=2026.1.0
  - petsc=3.25.3=real_*
  - petsc4py=3.25.3
  - mpi4py=4.1.2
  - openmpi=5.0.10
  - numpy=2.4.6
  - numba=0.65.1
  - scipy=1.18.0
  - gmsh=4.15.2
  - python-gmsh=4.15.2
  - pyvista=0.48.4
  - slepc4py
  - pytest
  - pip
